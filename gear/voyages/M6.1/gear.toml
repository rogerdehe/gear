# GEAR's own project config for voyage M6.1, copied from gear/voyages/M6/gear.toml: lanes on the self-hosted DeepSeek, reviewers on Claude Sonnet.
# Registered with: GEAR_ADMIN=1 gear admin init gear/voyages/M6.1/gear.toml

[project]
id = "gear"
herdr_session = "orch"
repo = "/Volumes/Data/myai/gear"

[quota]
lanes = 2
temps = 2

[[quota.sources]]
provider = "codex"
reader = "codex"

[captain]
pane = "w2:p2"
kind = "claude"
profile = "claude"

# M6.1: two lanes on the self-hosted DeepSeek V4.1 Flash (hk-dgx-1), thinking high, 600K context (user, 2026-11-01).
[[lanes]]
name = "hull"
duty = "M6.1 engine, model and usage: crates/gear-engine, gear-model, gear-usage"
owns = ["crates/gear-engine/", "crates/gear-model/", "crates/gear-usage/"]
charter = """You run on a flash model. Implement the packet exactly as written, in the files it names; never design, widen or reinterpret it. When the packet is unclear, contradicts the code, or cannot be done as written, ask the captain with `gear send --kind question` and give a default, instead of guessing."""
kind = "pi"
profile = "pi"
models = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 600 },
]

[[lanes]]
name = "mast"
duty = "M6.1 app, store, board, CLI, herdr, forge, skills, docs and build files: everything outside hull's crates"
owns = ["crates/gear-app/", "crates/gear-store/", "crates/gear-cli/", "crates/gear-herdr/", "crates/gear-board/", "crates/gear-forge/", "skills/", "Makefile", "docs/", "scripts/", ".github/", "README.md", "herdr-plugin.toml", "bin/", "Cargo.toml", "Cargo.lock"]
charter = """You run on a flash model. Implement the packet exactly as written, in the files it names; never design, widen or reinterpret it. When the packet is unclear, contradicts the code, or cannot be done as written, ask the captain with `gear send --kind question` and give a default, instead of guessing."""
kind = "pi"
profile = "pi"
models = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 600 },
]

# GEAR lanes run pi without pi-lens (uninstalled 2026-10-28).
[profiles.pi]
unattended_args = ["--approve"]

[temps]                  # reviewers: Claude Code on Claude Sonnet 5.5, no fallback (user, 2026-11-01)
charter = """You run on a strong model. Judge one candidate against its contract and the voyage's bar (DELIVERABLE): an error in normal use blocks it, an edge case outside normal use is logged, a style preference is neither. Check what the contract asks, in the files it names, and run only the acceptance it names."""
kind = "claude"
profile = "claude"

[models]
lanes = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 600 },
]
# The reviewer never runs the model it reviews.
review = [
  { model = "claude-sonnet-5-5", cli = "claude", args = ["--effort", "high"] },
]
on_quota = { lanes = "wait", review = "wait" }   # M5 (user): no fallback; spent means wait for the user
quota_reset_h = 5

# [schedule]
# depart_at: none; M6.1 departs when its plan is applied

[conventions]
integration = "dev"
release = "main"
gate = "make gate"   # T-238 (M4.2): 4 build jobs and 4 test threads on the shared machine

[timing]
handin_base_window_min = 120   # M5: tasks run past 30 min, so every hand-in re-merged dev and re-ran its suite (friction F-141, F-144, F-153, F-164); the merge gate runs the full suite on the real tip
