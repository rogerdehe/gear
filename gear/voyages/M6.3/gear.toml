# GEAR's own project config for voyage M6.3, copied from gear/voyages/M7/gear.toml (lanes on the self-hosted DeepSeek Flash, reviewers on DeepSeek V4 Pro 0813 via DashScope).
# Registered with: GEAR_ADMIN=1 gear admin init gear/voyages/M6.2/gear.toml

[project]
id = "gear"
herdr_session = "orch"
repo = "/Volumes/Data/myai/gear"

[quota]
lanes = 2
temps = 2

[[quota.sources]]
provider = "codex"
reader = "codex"

[captain]
pane = "w2:p2"
kind = "claude"
profile = "claude"

# M6.2: two lanes on DeepSeek V4.1 Flash via TokenRhythm (user, 2026-11-01: replaces the self-hosted hk-dgx-1 after its key was revoked), thinking high, 600K context.
[[lanes]]
name = "hull"
duty = "M6.3 engine, model and usage: crates/gear-engine (but finished.rs, quiet.rs and lane_nudge.rs, mast's since station M-8316), gear-model, gear-usage"
owns = ["crates/gear-engine/Cargo.toml", "crates/gear-engine/examples/", "crates/gear-engine/tests/", "crates/gear-engine/src/attention.rs", "crates/gear-engine/src/audit.rs", "crates/gear-engine/src/blocked.rs", "crates/gear-engine/src/busy.rs", "crates/gear-engine/src/captain_quota.rs", "crates/gear-engine/src/composer.rs", "crates/gear-engine/src/delivery.rs", "crates/gear-engine/src/dialog.rs", "crates/gear-engine/src/dispatch.rs", "crates/gear-engine/src/doorbell.rs", "crates/gear-engine/src/feature.rs", "crates/gear-engine/src/feed.rs", "crates/gear-engine/src/friction.rs", "crates/gear-engine/src/guardrails.rs", "crates/gear-engine/src/handover.rs", "crates/gear-engine/src/health.rs", "crates/gear-engine/src/hours.rs", "crates/gear-engine/src/lib.rs", "crates/gear-engine/src/merge.rs", "crates/gear-engine/src/model.rs", "crates/gear-engine/src/names.rs", "crates/gear-engine/src/observe.rs", "crates/gear-engine/src/onboard.rs", "crates/gear-engine/src/opencode.rs", "crates/gear-engine/src/ops.rs", "crates/gear-engine/src/overrun.rs", "crates/gear-engine/src/panes.rs", "crates/gear-engine/src/parallel.rs", "crates/gear-engine/src/quota.rs", "crates/gear-engine/src/rebind.rs", "crates/gear-engine/src/release.rs", "crates/gear-engine/src/restart.rs", "crates/gear-engine/src/review.rs", "crates/gear-engine/src/rounds.rs", "crates/gear-engine/src/rules.rs", "crates/gear-engine/src/session.rs", "crates/gear-engine/src/session_runner.rs", "crates/gear-engine/src/silent.rs", "crates/gear-engine/src/stall.rs", "crates/gear-engine/src/start.rs", "crates/gear-engine/src/switch.rs", "crates/gear-engine/src/tailed.rs", "crates/gear-engine/src/testtmp.rs", "crates/gear-engine/src/trust.rs", "crates/gear-engine/src/waits.rs", "crates/gear-model/", "crates/gear-usage/"]
charter = """You run on a flash model. Implement the packet exactly as written, in the files it names; never design, widen or reinterpret it. When the packet is unclear, contradicts the code, or cannot be done as written, ask the captain with `gear send --kind question` and give a default, instead of guessing."""
kind = "pi"
profile = "pi"
models = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 500 },
]

[[lanes]]
name = "mast"
duty = "M6.3 engine reclaim and nudges (finished.rs, quiet.rs, lane_nudge.rs), app, store, board, CLI, herdr, forge, skills, docs and build files: everything outside hull's crates"
owns = ["crates/gear-engine/src/finished.rs", "crates/gear-engine/src/quiet.rs", "crates/gear-engine/src/lane_nudge.rs", "crates/gear-app/", "crates/gear-store/", "crates/gear-cli/", "crates/gear-herdr/", "crates/gear-board/", "crates/gear-forge/", "skills/", "Makefile", "docs/", "scripts/", ".github/", "README.md", "herdr-plugin.toml", "bin/", "Cargo.toml", "Cargo.lock"]
charter = """You run on a flash model. Implement the packet exactly as written, in the files it names; never design, widen or reinterpret it. When the packet is unclear, contradicts the code, or cannot be done as written, ask the captain with `gear send --kind question` and give a default, instead of guessing."""
kind = "pi"
profile = "pi"
models = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 500 },
]

# GEAR lanes run pi without pi-lens (uninstalled 2026-10-28).
[profiles.pi]
unattended_args = ["--approve"]

[temps]                  # reviewers: pi on DeepSeek V4 Pro 0813 via DashScope (user, 2026-11-05; was TokenRhythm)
charter = """You run on a strong model. Judge one candidate against its contract and the voyage's bar (DELIVERABLE): an error in normal use blocks it, an edge case outside normal use is logged, a style preference is neither. Check what the contract asks, in the files it names, and run only the acceptance it names."""
kind = "pi"
profile = "pi"

[models]
lanes = [
  { model = "hk-dgx-1/DeepSeek-V4.1-Flash-1017", cli = "pi", args = ["--thinking", "high"], context_window_k = 500 },
]
# The reviewer never runs the model it reviews.
review = [
  { model = "dashscope/deepseek-v4-pro-0813", cli = "pi", args = ["--thinking", "high"], context_window_k = 1000 },
]
on_quota = { lanes = "wait", review = "wait" }   # M5 (user): no fallback; spent means wait for the user
quota_reset_h = 5

# [schedule]
# depart_at: none; M6.2 departs when its plan is applied

[conventions]
integration = "dev"
release = "main"
gate = "make gate"   # T-238 (M4.2): 4 build jobs and 4 test threads on the shared machine

[timing]
handin_base_window_min = 120   # M5: tasks run past 30 min, so every hand-in re-merged dev and re-ran its suite (friction F-141, F-144, F-153, F-164); the merge gate runs the full suite on the real tip
