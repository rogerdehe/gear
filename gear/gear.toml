# GEAR's own project config. M3 kickoff confirmed by the user 2026-10-25; M4 config v20: ownership re-split, lanes on MiniMax only.
# Registered with: GEAR_ADMIN=1 GEAR_DB=~/.local/state/gear/gear.db gear admin init gear/gear.toml

[project]
id = "gear"
herdr_session = "orch"
repo = "/Volumes/Data/myai/gear"

[quota]
lanes = 4
temps = 4

[captain]
pane = "w2:p2"
kind = "claude"
profile = "claude"

[[lanes]]
name = "hull"
duty = "M4 engine seats and sessions: the session rule and its actions, warm reviewers, reviewer worktrees, quota from the providers, kind change and rebind; gear-app config, tasks, seats, review, identity"
owns = ["crates/gear-engine/src/onboard.rs", "crates/gear-engine/src/restart.rs", "crates/gear-engine/src/release.rs", "crates/gear-engine/src/review.rs", "crates/gear-engine/src/switch.rs", "crates/gear-engine/src/start.rs", "crates/gear-engine/src/quota.rs", "crates/gear-engine/src/captain_quota.rs", "crates/gear-engine/src/opencode.rs", "crates/gear-engine/src/model.rs", "crates/gear-engine/src/trust.rs", "crates/gear-engine/src/guardrails.rs", "crates/gear-engine/src/attention.rs", "crates/gear-engine/src/feed.rs", "crates/gear-engine/src/tailed.rs", "crates/gear-engine/src/session.rs", "crates/gear-app/src/config.rs", "crates/gear-app/src/tasks.rs", "crates/gear-app/src/seats.rs", "crates/gear-app/src/review.rs", "crates/gear-app/src/identity.rs"]
kind = "codex"
profile = "codex"
# M4 2026-10-26 20:20 (user): hull switched to Codex GPT-6.1 Terra for the complex engine work; no fallback.
models = [
  { model = "gpt-6.1-terra", cli = "codex", args = ["-c", "model_reasoning_effort=medium"] },
]

[[lanes]]
name = "deck"
duty = "M4 store schema v6, agent profiles, the gear-usage crate (token and quota readers), the board, the forge, docs and scripts"
owns = ["crates/gear-model/", "crates/gear-store/", "crates/gear-board/", "crates/gear-herdr/", "crates/gear-forge/", "crates/gear-usage/", "docs/", "scripts/", ".github/", "README.md", "herdr-plugin.toml", "bin/", "Cargo.toml", "Cargo.lock"]
kind = "pi"
profile = "pi"
# M4 kickoff (user): MiniMax M3.1 Flash only, no fallback; a quota stop waits for the reset.
models = [
  { model = "minimax-cn/MiniMax-M3.1-Flash", cli = "pi" },
]

[[lanes]]
name = "keel"
duty = "M4 engine flow: dispatch, delivery, doorbells, rounds and tokens, the overrun question, declared waits, the friction ring, the Herdr connection, merge and PR landing"
owns = ["crates/gear-engine/Cargo.toml", "crates/gear-engine/examples/", "crates/gear-engine/tests/", "crates/gear-engine/src/lib.rs", "crates/gear-engine/src/dispatch.rs", "crates/gear-engine/src/delivery.rs", "crates/gear-engine/src/doorbell.rs", "crates/gear-engine/src/ops.rs", "crates/gear-engine/src/observe.rs", "crates/gear-engine/src/stall.rs", "crates/gear-engine/src/busy.rs", "crates/gear-engine/src/blocked.rs", "crates/gear-engine/src/names.rs", "crates/gear-engine/src/parallel.rs", "crates/gear-engine/src/merge.rs", "crates/gear-engine/src/rounds.rs", "crates/gear-engine/src/overrun.rs", "crates/gear-engine/src/waits.rs"]
kind = "pi"
profile = "pi"
# M4 kickoff (user): MiniMax M3.1 Flash only, no fallback; a quota stop waits for the reset.
models = [
  { model = "minimax-cn/MiniMax-M3.1-Flash", cli = "pi" },
]

[[lanes]]
name = "mast"
duty = "M4 CLI and app: plan apply, mail, queue, friction and decision commands, the voyage report and landing, rebind, admin stop; the skills"
owns = ["crates/gear-cli/", "crates/gear-app/Cargo.toml", "crates/gear-app/tests/", "crates/gear-app/src/admin.rs", "crates/gear-app/src/base.rs", "crates/gear-app/src/captain.rs", "crates/gear-app/src/draft.rs", "crates/gear-app/src/github.rs", "crates/gear-app/src/home.rs", "crates/gear-app/src/kickoff.rs", "crates/gear-app/src/lib.rs", "crates/gear-app/src/mail.rs", "crates/gear-app/src/plan.rs", "crates/gear-app/src/skill.rs", "crates/gear-app/src/standard.rs", "crates/gear-app/src/station.rs", "crates/gear-app/src/time.rs", "skills/"]
kind = "pi"
profile = "pi"
# M4 kickoff (user): MiniMax M3.1 Flash only, no fallback; a quota stop waits for the reset.
models = [
  { model = "minimax-cn/MiniMax-M3.1-Flash", cli = "pi" },
]

[temps]                  # reviewers: Codex gpt-6.1-sol, reasoning medium, first; then OpenCode Go deepseek-v4-pro (M3.1 kickoff)
kind = "codex"
profile = "codex"

[models]
# M3 kickoff (user): lanes MiniMax M3.1 Flash, then OpenCode Go DeepSeek V4.1
# Flash (both on OpenCode: an in-place switch). Reviewers Codex sol medium, then
# OpenCode Go DeepSeek V4 Pro (another CLI: closed and restarted in the pane).
# Both exhausted: park quota_reset_h hours, then back to the first model.
lanes = [
  "minimax-cn/MiniMax-M3.1-Flash",
]
# The reviewer never runs the model it reviews.
review = [
  { model = "gpt-6.1-sol", cli = "codex", args = ["-c", "model_reasoning_effort=medium"] },
  { model = "opencode-go/deepseek-v4-pro", cli = "opencode" },
]
on_quota = { lanes = "wait", review = "fallback" }   # M4 (user): lanes wait for the reset, no fallback
quota_reset_h = 5

# The in-place model switch (T-33): what `/model` shows in the picker and what
# the status bar says once the model is on. Required for an OpenCode lane or
# reviewer on that model — without it the seat is flagged, never closed.
[models.switch."minimax-cn/MiniMax-M3.1-Flash"]
picker = "MiniMax-M3.1-Flash minimax.cn"   # exactly one entry: the official provider (OpenCode Go has "MiniMax M3.1 Flash")
bar = "MiniMax-M3.1-Flash MiniMax (minimax.cn)"

[models.switch."opencode-go/deepseek-v4.1-flash"]
picker = "DeepSeek V4.1 Flash OpenCode Go"
bar = "DeepSeek V4.1 Flash OpenCode Go"
variant = "high"

[models.switch."opencode-go/deepseek-v4-pro"]
picker = "DeepSeek V4 Pro (New) OpenCode Go"
bar = "DeepSeek V4 Pro (New) OpenCode Go"
variant = "high"

[conventions]
integration = "dev"
release = "main"
# The gate runs every test in parallel and warns about each test over 10 s (user, 2026-10-26).
gate = "cargo build --workspace --all-targets && scripts/test.sh"
