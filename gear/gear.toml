# GEAR's own project config. M2 kickoff confirmed by the user 2026-10-23.
# Registered with: GEAR_ADMIN=1 GEAR_DB=~/.local/state/gear/gear.db gear admin init gear/gear.toml

[project]
id = "gear"
herdr_session = "orch"
repo = "/Volumes/Data/myai/gear"

[quota]
lanes = 3
temps = 3

[captain]
pane = "w2:p2"
kind = "claude"
profile = "claude"

[[lanes]]
name = "steady"
duty = "Stability, so GEAR never stops: cross-CLI model fallback, the captain's quota, merging beside the tick, finishing a lane's retirement, early low-queue warnings, a hand-in that does not ring the captain"
owns = ["crates/gear-engine/", "crates/gear-herdr/"]
kind = "opencode"
profile = "opencode"

[[lanes]]
name = "course"
duty = "Holding the course: per-attempt timestamps and time accounting, the voyage report, drift signals found in practice, stale-item re-alerts, the tail declaration, board wording"
owns = ["crates/gear-model/", "crates/gear-store/", "crates/gear-app/", "crates/gear-board/"]
kind = "opencode"
profile = "opencode"

[[lanes]]
name = "base"
duty = "The base for other users: store schema version, gear --version, the kickoff skeleton, the deletion pass, the install path"
owns = ["crates/gear-cli/", "skills/", "docs/", "scripts/", ".github/", "README.md", "herdr-plugin.toml", "bin/"]
kind = "opencode"
profile = "opencode"

[temps]                  # reviewers: Codex gpt-6.1-sol, reasoning high; the fallback is Claude Code claude-sonnet-5-5 --effort high (T-35)
kind = "codex"
profile = "codex"

[models]
# A chain entry may name the CLI that runs the model and the arguments that
# CLI starts with (T-35). The first entry runs on the lane's own CLI (the
# in-place switch of T-33); the second one needs another CLI, so the engine
# closes the agent and starts codex in the same pane and worktree.
lanes = [
  "minimax-cn/MiniMax-M3.1-Flash",
  { model = "gpt-6.1-sol", cli = "codex", args = ["-c", "model_reasoning_effort=medium"] },
]
# The reviewer never runs the model it reviews: when a lane fell back to
# gpt-6.1-sol, the review runs the next entry of this chain (Claude Code).
review = [
  { model = "gpt-6.1-sol", cli = "codex", args = ["-c", "model_reasoning_effort=high"] },
  { model = "claude-sonnet-5-5", cli = "claude", args = ["--effort", "high"] },
]
on_quota = { lanes = "fallback", review = "fallback" }
quota_reset_h = 5

# The in-place model switch (T-33): what `/model` shows in the picker and what
# the status bar says once the model is on. Required for an OpenCode lane or
# reviewer on that model — without it the seat is flagged, never closed.
[models.switch."minimax-cn/MiniMax-M3.1-Flash"]
picker = "MiniMax-M3.1-Flash minimax.cn"   # exactly one entry: the official provider (OpenCode Go has "MiniMax M3.1 Flash")
bar = "MiniMax-M3.1-Flash MiniMax (minimax.cn)"

[conventions]
integration = "dev"
release = "main"
