name: Release

# A release users install without Rust (T-27).
#
# On a `v*` tag: build `gear` for the three targets the plugin supports, package
# `gear-<version>-<target>.tar.gz` with a `.sha256` next to it, and upload both to
# the GitHub release of that tag. `scripts/fetch-or-build.sh` downloads exactly
# these assets at install time (and falls back to `cargo build --release`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.triple }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-latest
            triple: x86_64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The tag names the release; the plugin manifest names the version the
      # install step asks for. They must agree, or an install would look for
      # assets that this release does not carry.
      - name: Verify the tag matches the plugin and workspace versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' herdr-plugin.toml | head -n1)"
          workspace="$(sed -nE '/^\[workspace.package\]/,/^\[/s/^version *= *"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          for pair in "herdr-plugin.toml:$plugin" "Cargo.toml:$workspace"; do
            name="${pair%%:*}"
            version="${pair#*:}"
            if [ -z "$version" ] || [ "$tag" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME != $name version '$version'" >&2
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Build gear
        run: cargo build --release --target ${{ matrix.triple }} -p gear-cli

      - name: Package the archive and its checksum
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          triple="${{ matrix.triple }}"
          binary="target/$triple/release/gear"
          test -x "$binary"
          mkdir -p dist
          cp "$binary" dist/gear
          # `gear-<version>-<target>.tar.gz`, the name scripts/fetch-or-build.sh
          # downloads; the checksum file carries the same name plus `.sha256`.
          archive="gear-$version-$triple.tar.gz"
          tar -C dist -czf "dist/$archive" gear
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "--- $archive.sha256 ---"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: dist/*

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the release assets
        shell: bash
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} release/ \;
          echo "Publishing:"; ls -l release

      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
