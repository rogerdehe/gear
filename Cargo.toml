[workspace]
resolver = "2"
members = [
    "crates/gear-model",
    "crates/gear-store",
    "crates/gear-herdr",
    "crates/gear-app",
    "crates/gear-engine",
    "crates/gear-cli",
    "crates/gear-board",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
gear-model = { path = "crates/gear-model" }
gear-store = { path = "crates/gear-store" }
gear-herdr = { path = "crates/gear-herdr" }
gear-app = { path = "crates/gear-app" }
gear-engine = { path = "crates/gear-engine" }
gear-board = { path = "crates/gear-board" }
board-herdr = { git = "https://github.com/nelsonPires5/herdr-board", rev = "7a215a179acb4e098dd1c2971332497806309360" }

rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
